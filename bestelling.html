<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Je bestelling — Skiffa</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--papier:#F6F3ED;--mono:"DM Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--papier);color:#000;font-family:var(--mono);font-size:12px;letter-spacing:.06em;line-height:1.8}
main{max-width:560px;margin:0 auto;padding:48px 22px 60px}
.merk{font-size:20px;letter-spacing:.34em;font-weight:500;text-decoration:none;color:#000}
h1{font-size:14px;font-weight:500;margin:36px 0 6px}
.sub{opacity:.6}
.stappen{display:flex;gap:6px;margin:26px 0}
.stappen div{flex:1;text-align:center;font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.4}
.stappen div::before{content:"";display:block;height:2px;background:#000;margin-bottom:8px;opacity:.25}
.stappen div.aan{opacity:1}.stappen div.aan::before{opacity:1}
table{width:100%;border-collapse:collapse;margin-top:18px}
td{padding:6px 0;border-bottom:1px solid rgba(0,0,0,.12)}
.r{text-align:right}
.knop{display:inline-block;margin:22px 10px 0 0;background:#000;color:#fff;text-decoration:none;border-radius:999px;padding:7px 18px;font-size:11px}
.knop.lijn{background:none;color:#000;border:1px solid #000}
.fout{margin-top:30px}
</style>
</head>
<body>
<main>
  <a class="merk" href="/">SKIFFA</a>
  <div id="inhoud"><h1>Je bestelling wordt geladen…</h1></div>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const euro=v=>'€ '+Number(v||0).toFixed(2).replace('.',',');
const q=new URLSearchParams(location.search),nr=q.get('nr'),t=q.get('t');
const STAP={open:0,mislukt:0,betaald:1,in_productie:2,deels_verzonden:3,verzonden:3,geleverd:4};
const TEKST={
  open:['We wachten op je betaling.','Dit duurt meestal een paar seconden. Deze pagina ververst vanzelf.'],
  mislukt:['De betaling is niet gelukt.','Er is niets afgeschreven. Je mandje staat nog klaar in de winkel.'],
  betaald:['Dank je. Je betaling is binnen.','We gaan je poster drukken en sturen je een mail zodra hij onderweg is.'],
  in_productie:['Je poster wordt gedrukt.','Binnenkort gaat hij opgerold in een koker op de post.'],
  deels_verzonden:['Een deel van je bestelling is onderweg.','De rest volgt in een aparte zending; je krijgt daar ook een mail van.'],
  verzonden:['Je poster is onderweg.','Opgerold in een stevige koker.'],
  geleverd:['Je poster is bezorgd.','Veel plezier ermee aan de muur.'],
  geannuleerd:['Deze bestelling is geannuleerd.','Vragen? Mail naar hallo@skiffa.nl.'],
  terugbetaald:['Deze bestelling is terugbetaald.','Het geld staat binnen een paar werkdagen op je rekening.'],
};
let pogingen=0;
async function laad(){
  if(!nr||!t){fout();return;}
  let j=null;try{j=await fetch(`/api/bestel?nr=${encodeURIComponent(nr)}&t=${encodeURIComponent(t)}`,{cache:'no-store'}).then(r=>r.json());}catch(_){}
  if(!j||!j.ok){fout();return;}
  const [kop,sub]=TEKST[j.status]||['Je bestelling',''];
  if(STAP[j.status]>=1){try{localStorage.removeItem('skiffa-mandje');}catch(_){}}
  const stap=STAP[j.status];
  document.getElementById('inhoud').innerHTML=`
    <h1>${esc(kop)}</h1><p class="sub">${esc(sub)}</p>
    ${stap!==undefined&&j.status!=='mislukt'?`<div class="stappen">${['besteld','betaald','in productie','verzonden','bezorgd'].map((s,i)=>`<div class="${i<=stap?'aan':''}">${s}</div>`).join('')}</div>`:''}
    <p style="margin-top:18px">bestelling <b>${esc(j.nummer)}</b></p>
    <table>${j.regels.map(r=>`<tr><td>${r.aantal}× poster ${esc(r.naam)} <span class="sub">${esc(r.formaatLabel)}</span></td><td class="r">${euro(r.prijs*r.aantal)}</td></tr>`).join('')}
      <tr><td>verzending</td><td class="r">${j.verzending?euro(j.verzending):'gratis'}</td></tr>
      <tr><td><b>totaal</b></td><td class="r"><b>${euro(j.totaal)}</b></td></tr></table>
    ${(j.zendingen||[]).length?(j.zendingen.map((z,i)=>`<p style="margin-top:${i?6:18}px">${j.zendingen.length>1?`zending ${i+1}`:'track-and-trace'}${z.vervoerder?` (${esc(z.vervoerder)})`:''}: ${z.url?`<a href="${esc(z.url)}" target="_blank" rel="noopener">${esc(z.code||'volg je zending')}</a>`:`<b>${esc(z.code)}</b>`}</p>`).join('')):j.track_trace?`<p style="margin-top:18px">track-and-trace: ${/^https?:\/\//.test(j.track_trace)?`<a href="${esc(j.track_trace)}" target="_blank" rel="noopener">${esc(j.track_trace)}</a>`:`<b>${esc(j.track_trace)}</b>`}</p>`:''}
    ${j.factuur?`<a class="knop" href="${esc(j.factuur)}" target="_blank" rel="noopener">factuur bekijken</a>`:''}
    <a class="knop lijn" href="/">terug naar de winkel</a>
    ${j.annuleren_mogelijk?`<details style="margin-top:22px"><summary class="sub" style="cursor:pointer">annulering aanvragen</summary>
      <p class="sub" style="margin:8px 0">Je poster wordt op bestelling gedrukt en kan al in productie zijn. We laten je weten of annuleren nog kan.</p>
      <textarea id="reden" rows="3" style="width:100%;font:inherit;padding:8px" placeholder="reden (optioneel)"></textarea>
      <button class="knop lijn" id="annuleer" type="button">verzoek versturen</button><p class="sub" id="annUit"></p></details>`:j.annulering_aangevraagd?'<p class="sub" style="margin-top:18px">Je annuleringsverzoek is ontvangen; we nemen contact met je op.</p>':''}
    ${j.melden_mogelijk?`<details style="margin-top:22px" id="melden"><summary class="sub" style="cursor:pointer">probleem melden (beschadigd, verkeerde poster)</summary>
      <p class="sub" style="margin:8px 0">Vervelend als er iets mis is. Stuur een paar foto's mee (van de poster én de verpakking); dan lossen we het zo snel mogelijk op.</p>
      <select id="mSoort" style="font:inherit;padding:6px;margin-bottom:8px"><option value="schade">beschadigd aangekomen</option><option value="verkeerd">verkeerde poster of formaat</option><option value="anders">iets anders</option></select>
      ${j.regels.length>1?`<div class="sub" style="margin-bottom:8px">${j.regels.map((r,i)=>`<label style="display:block"><input type="checkbox" class="mRegel" value="${esc(j.regel_ids[i])}"> ${esc(r.naam)} ${esc(r.formaatLabel)}</label>`).join('')}</div>`:''}
      <textarea id="mTekst" rows="3" style="width:100%;font:inherit;padding:8px" placeholder="wat is er aan de hand?"></textarea>
      <label class="sub" style="display:block;margin-top:8px">foto's (max. 5) <input type="file" id="mFotos" accept="image/jpeg,image/png,image/webp,image/heic" multiple></label>
      <button class="knop lijn" id="meld" type="button">melding versturen</button><p class="sub" id="mUit"></p></details>`:''}`;
  document.getElementById('annuleer')?.addEventListener('click',async e=>{e.target.disabled=true;
    let r=null;try{r=await fetch('/api/bestel',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({actie:'annuleringsverzoek',nr,t,reden:document.getElementById('reden').value})}).then(x=>x.json());}catch(_){}
    document.getElementById('annUit').textContent=r?.melding||'Versturen lukte niet. Mail ons gerust.';if(!r?.ok)e.target.disabled=false;});
  document.getElementById('meld')?.addEventListener('click',async e=>{
    const uit=document.getElementById('mUit'),fotos=[...document.getElementById('mFotos').files];
    if(fotos.length>5){uit.textContent='Maximaal 5 foto\'s.';return;}
    e.target.disabled=true;uit.textContent='Versturen…';
    const post=b=>fetch('/api/bestel',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({nr,t,...b})}).then(x=>x.json()).catch(()=>({ok:false}));
    const m=await post({actie:'melding',soort:document.getElementById('mSoort').value,omschrijving:document.getElementById('mTekst').value,regels:[...document.querySelectorAll('.mRegel:checked')].map(x=>x.value)});
    if(!m.ok){uit.textContent=m.melding||'Versturen lukte niet. Mail ons gerust.';e.target.disabled=false;return;}
    let mis=0;
    for(const [i,f] of fotos.entries()){
      uit.textContent=`Foto ${i+1} van ${fotos.length} uploaden…`;
      const u=await post({actie:'melding-foto',id:m.id,bestandsnaam:f.name,bytes:f.size});
      if(!u.ok){mis++;continue;}
      const put=await fetch(u.url,{method:'PUT',headers:{'content-type':u.mime,'x-upsert':'true'},body:f}).catch(()=>null);
      if(!put||!put.ok){mis++;continue;}
      const k=await post({actie:'melding-foto-klaar',id:m.id,pad:u.pad});if(!k.ok)mis++;
    }
    uit.textContent=mis?`Je melding is ontvangen, maar ${mis} foto${mis>1?'\'s':''} kwam${mis>1?'en':''} niet aan. Mail die gerust na.`:'Je melding is ontvangen. We nemen zo snel mogelijk contact met je op.';
    document.getElementById('mTekst').disabled=true;
  });
  if(j.status==='open'&&pogingen++<12)setTimeout(laad,2500);
}
function fout(){document.getElementById('inhoud').innerHTML='<h1 class="fout">We konden deze bestelling niet vinden.</h1><p class="sub">Gebruik de link uit je bevestigingsmail, of mail naar hallo@skiffa.nl.</p><a class="knop lijn" href="/">terug naar de winkel</a>';}
laad();
</script>
</body>
</html>
