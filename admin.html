<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Skiffa administratie</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--papier:#F6F3ED;--zee:#E9EEF0;--lijn:rgba(0,0,0,.14);--rood:#a3261a;--groen:#2f6b3a;--mono:"DM Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--papier);color:#111;font-family:var(--mono);font-size:12px;letter-spacing:.03em;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:1px solid #111;border-radius:999px;padding:5px 14px}
button.vol{background:#111;color:#fff}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{border:1px solid #111;border-radius:8px;padding:7px 10px;background:#fff}
a{color:inherit}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--lijn);gap:12px;flex-wrap:wrap}
header b{letter-spacing:.3em;font-size:14px}
main{padding:22px;max-width:1280px;margin:0 auto}
.kaarten{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.kaart{background:#fff;border:1px solid var(--lijn);border-radius:12px;padding:14px 16px}
.kaart small{display:block;font-size:10px;letter-spacing:.14em;opacity:.6;text-transform:uppercase}
.kaart b{font-size:20px;font-weight:500}
.balk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.balk .tab{border-color:var(--lijn)}
.balk .tab[aria-pressed=true]{background:#111;color:#fff;border-color:#111}
.balk input[type=search]{min-width:240px;flex:1;max-width:360px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--lijn);border-radius:12px;overflow:hidden}
th{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;padding:9px 10px;border-bottom:1px solid var(--lijn);font-weight:400}
td{padding:9px 10px;border-bottom:1px solid var(--lijn);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--zee)}
.r{text-align:right}
.st{display:inline-block;padding:1px 8px;border-radius:999px;font-size:10px;letter-spacing:.08em;border:1px solid currentColor;white-space:nowrap}
.st.open{color:#8a6d00}.st.betaald,.st.in_productie,.st.deels_verzonden{color:#1d4ed8}.st.verzonden,.st.geleverd{color:var(--groen)}
.st.geannuleerd,.st.mislukt{color:#777}.st.terugbetaald{color:var(--rood)}
.leeg{padding:30px;text-align:center;opacity:.6;background:#fff;border:1px solid var(--lijn);border-radius:12px}
#paneel{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;z-index:10}
#paneel.open{display:block}
#paneel .vak{position:absolute;top:0;right:0;bottom:0;width:min(620px,100vw);background:var(--papier);overflow:auto;padding:22px 24px 40px;box-shadow:-10px 0 30px rgba(0,0,0,.12)}
.vak h2{font-size:15px;font-weight:500;letter-spacing:.06em;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.blok{background:#fff;border:1px solid var(--lijn);border-radius:12px;padding:14px 16px;margin-top:14px}
.blok h3{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.6;font-weight:400;margin-bottom:8px}
.blok table{border:0}
.blok td{border-bottom:1px dashed var(--lijn);padding:5px 0}
.acties{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.acties input{width:auto;flex:1;min-width:160px}
.log{font-size:11px}
.log div{padding:4px 0;border-bottom:1px dashed var(--lijn);display:grid;grid-template-columns:118px 90px 1fr;gap:8px}
.log .fout{color:var(--rood)}
#melding{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 16px;border-radius:999px;opacity:0;transition:opacity .3s;z-index:20;pointer-events:none}
#melding.aan{opacity:1}#melding.fout{background:var(--rood)}
#login{max-width:340px;margin:12vh auto;background:#fff;border:1px solid var(--lijn);border-radius:16px;padding:28px}
#login h1{font-size:14px;letter-spacing:.3em;margin-bottom:18px}
#login input{width:100%;margin:6px 0 12px}
.waarschuw{background:#fff7e0;border:1px solid #e5c76b;border-radius:10px;padding:10px 14px;margin-bottom:16px}
.verberg{display:none!important}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button[aria-current=true]{background:#111;color:#fff}
.kb{display:inline-block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:0 6px;border-radius:4px;background:var(--zee);margin-left:6px}
.kb.bol{background:#e6efff}.kb.etsy{background:#ffe9dc}.kb.amazon{background:#fff3cc}
.kanalen{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:14px}
.kanaal{background:#fff;border:1px solid var(--lijn);border-radius:12px;padding:16px}
.kanaal h3{font-size:13px;font-weight:500;letter-spacing:.1em;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.kanaal .rij{display:grid;grid-template-columns:1fr 130px;gap:6px 10px;align-items:center;margin:4px 0}
.kanaal .rij input:not(.schakel),.kanaal .rij select{width:100%}
.kanaal .rij .schakel{justify-self:end}
#assortLijst{overflow-x:auto;-webkit-overflow-scrolling:touch}
#assortLijst table{min-width:720px}
.ok{color:var(--groen)}.nok{color:var(--rood)}
.mini{font-size:10px;opacity:.7}
.assort{margin-top:22px}
.assort td input[type=text]{width:150px;font-size:11px;padding:4px 8px}
.assort tbody tr{cursor:default}
.schakel{appearance:none;width:30px;height:16px;border-radius:999px;background:#ccc;position:relative;cursor:pointer;vertical-align:middle;border:0;padding:0}
.schakel:checked{background:#111}
.schakel::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .2s}
.schakel:checked::after{left:16px}
.st.concept{color:#777}.st.gereed{color:#8a6d00}.st.actief{color:var(--groen)}.st.gearchiveerd{color:#999}
.drop{display:block;background:#fff;border:1.5px dashed #999;border-radius:12px;padding:18px;text-align:center;cursor:pointer;margin-bottom:14px}
.drop.over{border-color:#111;background:var(--zee)}
.drop code,.mini code{background:var(--zee);padding:0 4px;border-radius:4px}
.balkje{height:3px;background:var(--zee);border-radius:2px;overflow:hidden;margin-top:4px}.balkje i{display:block;height:100%;background:#111;width:0}
#pWachtrij table{margin-bottom:6px}#pWachtrij tbody tr{cursor:default}
.duim{width:34px;height:50px;object-fit:cover;border-radius:4px;display:block;background:var(--zee)}.leegbeeld{border:1px dashed #aaa}
.ptabel td{vertical-align:middle}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:14px}
.pform{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:8px 12px}
.pform label,.vgrid label{display:flex;flex-direction:column;gap:3px;font-size:10px;letter-spacing:.06em;opacity:.95}
.pform label.breed{grid-column:1/-1}
.pform input,.pform textarea,.pform select,.vgrid input,.vgrid textarea,.vgrid select{font-size:12px;padding:6px 8px;width:100%}
.vgrid label.rijtje{flex-direction:row;align-items:center;justify-content:space-between}
.vgrid label.rijtje input{width:auto}
.vgrid input.schakel,.pform input.schakel,table.kaal input.schakel{width:30px;padding:0}
input.kort{max-width:110px}
.pbeeld{width:100%;aspect-ratio:2/3;border:1px dashed #aaa;border-radius:10px;overflow:hidden;cursor:pointer;display:grid;place-items:center;font-size:11px;color:#777;background:var(--papier);position:relative}
.pbeeld img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.beelden{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:6px}
.bl{border:1px solid var(--lijn);border-radius:10px;overflow:hidden;background:var(--papier)}
.bl img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.blv{display:grid;gap:4px;padding:6px}.blv select,.blv input{font-size:11px;padding:3px 6px}.blv .acties button{padding:1px 9px;font-size:10px}
.bl.nieuw{display:grid;place-items:center;min-height:180px;cursor:pointer;border-style:dashed;color:#777;font-size:11px}
.schuif{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.kaal{border:0}table.kaal td,table.kaal th{padding:6px 8px}table.kaal input,table.kaal textarea{font-size:11px;padding:4px 6px;width:100%}
.vtabel{min-width:760px}.vtabel tbody tr.vrij{cursor:pointer}.vtabel tbody tr.vrij.open{background:var(--zee)}
.vdetail{border:1px solid #111;border-radius:12px;padding:12px;margin-top:12px;background:var(--papier)}
.vgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:8px 2px}
.vgrid h4{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.6;font-weight:400;margin-bottom:6px}
.vgrid > div{display:flex;flex-direction:column;gap:6px}
.ontbreekt{margin:6px 0 0 16px;font-size:11px;color:var(--rood)}
.controles{list-style:none;font-size:11px;display:grid;gap:3px;margin:6px 0}.controles .ok{color:var(--groen)}.controles .waarschuwing{color:#8a6d00}.controles .afgekeurd{color:var(--rood)}
.kosten{font-size:11px;background:#fff;border:1px solid var(--lijn);border-radius:8px;padding:8px 10px;margin-top:6px}
.proefvak{background:#fff;border:1px solid #111;border-radius:10px;padding:10px;margin-top:8px;display:grid;gap:8px}
.uits{position:relative;overflow:hidden;background:#eee;margin:6px 0}.uits img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:fill}
.uits i{position:absolute;outline:1.5px dashed #fff}.uits.papier{background:#fff;outline:1px solid #ccc}
.genereer{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:8px}.genereer label{display:flex;align-items:center;gap:6px;margin:3px 0}
.merkrij{display:grid;grid-template-columns:170px 1fr 80px;gap:6px 10px;align-items:center;margin:3px 0}
.pchip{display:inline-block;font-size:10px;padding:2px 8px;border-radius:99px;background:var(--zee);white-space:nowrap}
.pchip.actief{background:#d9efe0;color:var(--groen)}.pchip.fout{background:#fbe1e1;color:var(--rood)}.pchip.onvolledig{background:#fff2c9;color:#7a5c00}.pchip.gereed{background:#e3e9ff;color:#2a3f8f}.pchip.verwerken{background:#eee;color:#555}
.drie{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.drie div{background:var(--papier);border:1px solid var(--lijn);border-radius:10px;padding:8px 10px;display:grid;gap:2px}.drie b{font-size:12px;font-weight:500}
.splits{display:flex;flex-wrap:wrap;gap:4px 12px;width:100%;margin-top:4px}.splits label{display:flex;gap:4px;align-items:center}.acties .splits input{flex:none;min-width:0;width:auto}
@media (max-width:520px){.drie{grid-template-columns:1fr}}
.pcel{display:flex;align-items:center;gap:8px}.ptabel tr.open{background:var(--zee)}.ptabel tr.pdetail td{padding:0 8px 12px}
@media (max-width:900px){.pgrid{grid-template-columns:1fr}.vgrid{grid-template-columns:1fr}}
@media (max-width:760px){.drukrij{grid-template-columns:80px 1fr}.drukrij .acties{grid-column:1/-1}.vb{display:none}main{padding:14px}.log div{grid-template-columns:1fr}}
</style>
</head>
<body>
<form id="login" class="verberg">
  <h1>SKIFFA</h1>
  <p style="margin-bottom:10px">Administratie</p>
  <label>wachtwoord<input type="password" name="wachtwoord" autocomplete="current-password" required></label>
  <button class="vol" type="submit">inloggen</button>
  <p id="loginFout" style="color:var(--rood);margin-top:10px"></p>
</form>

<div id="app" class="verberg">
  <header>
    <b>SKIFFA</b>
    <div class="nav"><button data-view="bestellingen" aria-current="true">bestellingen</button><button data-view="producten">producten</button><button data-view="verkoop">verkoopkanalen</button><button data-view="kanalen">koppelingen</button></div>
    <span style="flex:1"></span>
    <a href="/" target="_blank" rel="noopener">winkel ↗</a>
    <button id="uitloggen">uitloggen</button>
  </header>
  <main>
    <div id="instellingen"></div>
    <section id="viewKanalen" class="verberg">
      <div class="kanalen" id="prodigiKaart" style="margin-bottom:14px"></div>
      <div class="kanalen" id="kanaalKaarten"></div>
      <div class="assort">
        <div class="balk"><b style="margin-right:8px">assortiment</b>
          <select id="assortKanaal"><option value="bol">bol.com</option><option value="etsy">Etsy</option><option value="amazon">Amazon</option></select>
          <button id="allesAan">alles aanbieden</button><button id="allesUit">niets aanbieden</button>
          <span class="mini" id="assortUitleg"></span></div>
        <div id="assortLijst"></div>
      </div>
    </section>
    <section id="viewProducten" class="verberg"><div id="producten"></div></section>
    <section id="viewVerkoop" class="verberg"><div id="verkoop"></div></section>
    <section id="viewBestellingen">
    <div class="kaarten" id="kaarten"></div>
    <div class="balk" id="filters">
      <button class="tab" data-f="actie" aria-pressed="true">te verzenden</button>
      <button class="tab" data-f="">alles</button>
      <button class="tab" data-f="open">open</button>
      <button class="tab" data-f="verzonden">verzonden</button>
      <button class="tab" data-f="geannuleerd">geannuleerd</button>
      <button class="tab" data-f="terugbetaald">terugbetaald</button>
      <select id="kanaalFilter"><option value="">alle kanalen</option><option value="webshop">webshop</option><option value="bol">bol.com</option><option value="etsy">Etsy</option><option value="amazon">Amazon</option></select>
      <input type="search" id="zoek" placeholder="zoek op nummer, naam, e-mail, factuur…">
      <span style="flex:1"></span>
      <label>van <input type="date" id="van"></label>
      <label>tot <input type="date" id="tot"></label>
      <button id="export">export csv</button>
    </div>
    <div id="lijst"></div>
    </section>
  </main>
</div>

<div id="paneel"><div class="vak" id="vak"></div></div>
<div id="melding"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const euro=v=>'€ '+Number(v||0).toFixed(2).replace('.',',');
const datum=d=>d?new Date(d).toLocaleString('nl-NL',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Amsterdam'}):'';
const LABEL={open:'open',betaald:'betaald',in_productie:'in productie',deels_verzonden:'deels verzonden',verzonden:'verzonden',geleverd:'geleverd',geannuleerd:'geannuleerd',mislukt:'mislukt',terugbetaald:'terugbetaald'};
const st=s=>`<span class="st ${esc(s)}">${esc(LABEL[s]||s)}</span>`;
let filter='actie',zoekTimer=null,huidig=null;

async function api(actie,{method='GET',body,params}={}){
  const q=new URLSearchParams({actie,...(params||{})});
  const r=await fetch('/api/admin?'+q,{method,headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});
  const j=await r.json().catch(()=>({ok:false,melding:'Onverwacht antwoord van de server.'}));
  if(r.status===401&&actie!=='login'){toonLogin();throw new Error('uit');}
  if(!j.ok)throw new Error(j.melding||'Mislukt');
  return j;
}
function meld(t,isFout){const m=$('#melding');m.textContent=t;m.className='aan'+(isFout?' fout':'');clearTimeout(m._t);m._t=setTimeout(()=>m.className='',2600);}

function toonLogin(){$('#app').classList.add('verberg');$('#login').classList.remove('verberg');$('#login [name=wachtwoord]').focus();}
$('#login').addEventListener('submit',async e=>{e.preventDefault();$('#loginFout').textContent='';
  try{await api('login',{method:'POST',body:{wachtwoord:e.target.wachtwoord.value}});e.target.reset();start();}
  catch(err){$('#loginFout').textContent=err.message;}});
$('#uitloggen').addEventListener('click',async()=>{await api('uitloggen').catch(()=>{});toonLogin();});

async function start(){
  const s=await fetch('/api/admin?actie=status-inlog').then(r=>r.json()).catch(()=>({}));
  if(!s.ingelogd){toonLogin();if(!s.ingesteld)$('#loginFout').textContent='Zet eerst ADMIN_WACHTWOORD (min. 12 tekens) in Vercel.';return;}
  $('#login').classList.add('verberg');$('#app').classList.remove('verberg');
  const mist=[!s.database&&'SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY (administratie)',!s.mollie&&'MOLLIE_API_KEY (betalen)',!s.mail&&'RESEND_API_KEY (mails)'].filter(Boolean);
  $('#instellingen').innerHTML=mist.length?`<div class="waarschuw">Nog niet ingesteld in Vercel: ${mist.map(esc).join(', ')}.</div>`:'';
  if(!s.database)return;
  laadOverzicht();laadLijst();
  const h=decodeURIComponent(location.hash.slice(1));if(h&&!['kanalen','producten'].includes(h)&&!h.startsWith('product/'))open(h);
}

async function laadOverzicht(){
  try{const o=await api('overzicht');
    $('#kaarten').innerHTML=[['te verzenden',o.teVerzenden],['omzet deze maand',euro(o.omzetMaand)],['omzet dit jaar',euro(o.omzetJaar)],['betaalde bestellingen',o.aantalBetaald],['open (onbetaald)',o.perStatus.open],['omzet per kanaal (jaar)',Object.entries(o.omzetPerKanaal||{}).filter(([,v])=>v).map(([k,v])=>`<span style="font-size:11px;display:block">${k} ${euro(v)}</span>`).join('')||'—']]
      .map(([k,v])=>`<div class="kaart"><small>${k}</small><b>${v}</b></div>`).join('');
  }catch(e){if(e.message!=='uit')meld(e.message,true);}
}
async function laadLijst(){
  try{const {bestellingen}=await api('bestellingen',{params:{status:filter,q:$('#zoek').value,kanaal:$('#kanaalFilter').value}});
    $('#lijst').innerHTML=bestellingen.length?`<table><thead><tr><th>bestelling</th><th>datum</th><th>klant</th><th class="vb">plaats</th><th>status</th><th class="r">totaal</th><th class="vb">factuur</th></tr></thead><tbody>${
      bestellingen.map(b=>`<tr data-id="${esc(b.id)}"><td><b>${esc(b.nummer)}</b>${b.kanaal&&b.kanaal!=='webshop'?`<span class="kb ${esc(b.kanaal)}">${esc(b.kanaal)}</span>`:''}</td><td>${datum(b.aangemaakt_op)}</td><td>${esc(b.naam)}<br><span style="opacity:.6">${esc(b.email)}</span></td><td class="vb">${esc(b.plaats)} (${esc(b.land)})</td><td>${st(b.status)}</td><td class="r">${euro(b.totaal)}</td><td class="vb">${esc(b.factuurnummer||'')}</td></tr>`).join('')}</tbody></table>`
      :`<div class="leeg">Geen bestellingen${filter==='actie'?' om te verzenden':''}.</div>`;
  }catch(e){if(e.message!=='uit')meld(e.message,true);}
}
$('#filters').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;filter=b.dataset.f;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));laadLijst();});
$('#zoek').addEventListener('input',()=>{clearTimeout(zoekTimer);zoekTimer=setTimeout(laadLijst,250);});
$('#kanaalFilter').addEventListener('change',laadLijst);
$('#lijst').addEventListener('click',e=>{const tr=e.target.closest('tr[data-id]');if(tr)open(tr.dataset.id);});
$('#export').addEventListener('click',()=>{const q=new URLSearchParams({actie:'export',van:$('#van').value,tot:$('#tot').value});location.href='/api/admin?'+q;});
{const n=new Date();$('#van').value=new Date(n.getFullYear(),n.getMonth(),1).toLocaleDateString('sv-SE');$('#tot').value=n.toLocaleDateString('sv-SE');}

async function open(id){
  try{const {bestelling:b}=await api('bestelling',{params:{id}});huidig=b;tekenPaneel(b);$('#paneel').classList.add('open');history.replaceState(null,'','#'+b.nummer);}
  catch(e){if(e.message!=='uit')meld(e.message,true);}
}
function sluit(){$('#paneel').classList.remove('open');huidig=null;history.replaceState(null,'',location.pathname);}
$('#paneel').addEventListener('click',e=>{if(e.target.id==='paneel')sluit();const np=e.target.closest('[data-naarproduct]');if(np){e.preventDefault();sluit();toonView('producten');Producten.product(np.dataset.naarproduct);}});
addEventListener('keydown',e=>{if(e.key==='Escape')sluit();});

const FSTATUS={wacht:'wacht (wijzigen kan nog)',bezig:'wordt verstuurd',opnieuw:'volgt opnieuw',onzeker:'onzeker: wordt gecontroleerd',verstuurd:'bij Prodigi',in_productie:'in productie bij Prodigi',verzonden:'verzonden door Prodigi',geblokkeerd:'geblokkeerd',fout:'fout',geannuleerd:'geannuleerd'};
function prodigiBlok(b){
  const f=b.fulfilment;
  if(!f)return b.betaald_op&&!['geannuleerd','terugbetaald'].includes(b.status)?`<div class="blok"><h3>prodigi</h3><div class="acties"><span class="mini">Niet aangemeld bij Prodigi.</span><button data-p="aanmelden">naar Prodigi</button></div></div>`:'';

async function papi(actie,body){
  const r=await fetch('/api/prodigi?actie='+actie,{method:body?'POST':'GET',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({ok:false,melding:'Onverwacht antwoord'}));

  const fs=(b.fulfilments||[]).filter(f=>f.status!=='geannuleerd'),f=fs[fs.length-1];
  const prod=f?[['fout','geblokkeerd','onzeker'].includes(f.status)?'nok':['verzonden','verstuurd','in_productie'].includes(f.status)?'ok':'',`Prodigi: ${FSTATUS[f.status]||f.status}${f.herdruk_nr?` (herdruk ${f.herdruk_nr})`:''}`]
    :(b.fulfilments||[]).length?['','Prodigi: geannuleerd']:b.status==='in_productie'||['deels_verzonden','verzonden','geleverd'].includes(b.status)?['ok','eigen productie']:['','nog niet in productie'];

$('#vak').addEventListener('click',async e=>{
  const pk=e.target.closest('button[data-p]');
  if(pk&&huidig){const a=pk.dataset.p,id=huidig.id;
    const vraag={annuleer:'Niet (meer) laten drukken door Prodigi?','reset-sandbox':'Proeforder loskoppelen? De bestelling gaat daarna live naar Prodigi.',aanmelden:'Deze bestelling naar Prodigi sturen?'}[a];
    if(vraag&&!confirm(vraag))return;
    const extra={};
    if(a==='vrijgeven'){extra.reden=prompt('Waarom mag deze opdracht toch naar Prodigi? (komt in het logboek)');if(!extra.reden)return;}
    if(a==='herdruk'){extra.reden=prompt('Reden van de herdruk (bv. beschadigd aangekomen, foto ontvangen):');if(!extra.reden)return;
      if(!confirm('Er wordt een NIEUWE, betaalde productieopdracht bij Prodigi geplaatst. Doorgaan?'))return;extra.bevestigd=true;}
    pk.disabled=true;
    try{const r=await papi(a,{id,...extra});meld(r.melding||(r.resultaat?`Prodigi: verstuurd ${r.resultaat.verstuurd}, geblokkeerd ${r.resultaat.geblokkeerd}, fout ${r.resultaat.fout}`:'Opgeslagen'));await open(id);laadLijst();}
    catch(x){if(x.message!=='uit')meld(x.message,true);pk.disabled=false;}
    return;}
  const k=e.target.closest('button[data-a]');if(!k||!huidig)return;const a=k.dataset.a,id=huidig.id;
  if(a==='sluit')return sluit();
  const bevestig={geannuleerd:'Bestelling annuleren? De klant krijgt een mail.',terugbetalen:'Geld terugstorten naar de klant?',betaald:'Markeren als betaald? Er wordt een factuurnummer toegekend en de klant krijgt de bevestiging.'};
  if(bevestig[a]&&!confirm(bevestig[a]))return;
  k.disabled=true;
  try{
    let res;
    if(['verzonden','in_productie','geleverd','geannuleerd'].includes(a)){const alle=[...document.querySelectorAll('#vak [data-regel]')],gekozen=alle.filter(i=>i.checked).map(i=>i.dataset.regel);
      if(a==='verzonden'&&alle.length&&!gekozen.length){meld('Kies minstens één regel voor dit pakket',true);k.disabled=false;return;}
      res=await api('status',{method:'POST',body:{id,status:a,track_trace:$('#tt')?.value,vervoerder:$('#vervoerder')?.value,regels:a==='verzonden'&&gekozen.length<alle.length?gekozen:undefined}});}
    else if(a==='betaald')res=await api('betaald',{method:'POST',body:{id}});
    else if(a==='terugbetalen')res=await api('terugbetalen',{method:'POST',body:{id,bedrag:$('#terugBedrag').value}});
    else if(a==='ververs')res=await api('ververs',{method:'POST',body:{id}});
    else if(a==='notitie')res=await api('notitie',{method:'POST',body:{id,tekst:$('#notitie').value}});
    else if(a.startsWith('mail-'))res=await api('mail',{method:'POST',body:{id,soort:a.slice(5)}});
    else if(a==='drukker'){res=await mapi('drukker',{id});meld(res.melding);await open(id);return;}
    meld(res.deels?'Zending vastgelegd (deels verzonden)'+(res.gemaild?', klant gemaild':''):res.gemaild?'Opgeslagen, klant gemaild':res.mollie?`Mollie: ${res.mollie}`:res.kanaal?`Opgeslagen; gaat bij de volgende sync naar ${res.kanaal}`:'Opgeslagen');
    await open(id);laadOverzicht();laadLijst();
  }catch(err){if(err.message!=='uit')meld(err.message,true);k.disabled=false;}
});

        <option value="zonder" ${s.branding_beleid==='zonder'?'selected':''}>zonder toevoeging verzenden (expliciet toegestaan)</option></select></div>
      <div class="rij" style="max-width:640px"><label>goedgekeurd alternatief</label><select data-pv="branding_alternatief"><option value="">—</option>${Object.entries(o.inserts).map(([k,l])=>`<option value="${k}" ${s.branding_alternatief===k?'selected':''}>${esc(l)}</option>`).join('')}</select></div>
      <div class="acties" style="margin-top:10px"><button class="vol" data-pa="opslaan">opslaan</button><button data-pa="ping">test verbinding (${omg})</button><button data-pa="verwerk">nu verwerken wat klaarstaat</button></div>
      <p class="mini" style="margin-top:6px">Het Prodigi-product koppel en controleer je per variant bij Beheer → producten (daar ook kosten en proefbestellingen). Statusmeldingen komen binnen op ${esc(o.callbackUrl)} (gaat automatisch mee met elke opdracht).</p>
      ${(o.aandacht||[]).length?`<div class="waarschuw" style="margin:10px 0 0">Aandacht nodig: ${o.aandacht.map(a=>`<a href="#${esc(a.bestellingen?.nummer||'')}" data-open="${esc(a.bestelling_id)}">${esc(a.bestellingen?.nummer||a.bestelling_id.slice(0,8))}</a>${a.herdruk_nr?` (herdruk ${a.herdruk_nr})`:''} (${esc(FSTATUS[a.status])}: ${esc((a.laatste_fout||'').slice(0,140))})`).join(' · ')}</div>`:''}
      ${(o.proef||[]).length?`<p class="mini" style="margin-top:8px"><b>Proefbestellingen</b>: ${o.proef.map(x=>`${datum(x.aangemaakt_op)} ${esc(x.omgeving)} · ${esc(x.status)}${x.extern_id?` (${esc(x.extern_id)})`:''}${x.offerte?.totaal!=null?` · ${euro(x.offerte.totaal)}`:''}`).join(' · ')}</p>`:''}
      <div class="mini" id="uit-prodigi" style="margin-top:8px"></div></div>`;
  }catch(e){if(e.message!=='uit')$('#prodigiKaart').innerHTML=`<div class="waarschuw" style="grid-column:1/-1;margin:0">Prodigi: ${esc(e.message)}</div>`;}
}
$('#prodigiKaart').addEventListener('click',async e=>{
  const ln=e.target.closest('[data-open]');if(ln){e.preventDefault();toonView('bestellingen');open(ln.dataset.open);return;}
  const b=e.target.closest('[data-pa]');if(!b)return;const uit=$('#uit-prodigi'),a=b.dataset.pa;
  if(a==='merk-upload'){const rij=b.closest('[data-merk]'),i=document.createElement('input');i.type='file';i.accept='image/png,image/jpeg';
    i.onchange=async()=>{const f=i.files[0];if(!f)return;try{const u=await fetch('/api/media?actie=merk-upload',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type:rij.dataset.merk,bytes:f.size,bestandsnaam:f.name})}).then(r=>r.json());if(!u.ok)throw new Error(u.melding);
      await new Promise((ok,nok)=>{const x=new XMLHttpRequest();x.open('PUT',u.url);x.setRequestHeader('content-type',f.type);x.setRequestHeader('x-upsert','true');x.onload=()=>x.status<300?ok():nok(new Error('upload mislukt'));x.onerror=()=>nok(new Error('upload mislukt'));x.send(f);});
      const v=await fetch('/api/media?actie=merk-bevestig',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pad:u.pad})}).then(r=>r.json());if(!v.ok)throw new Error(v.melding);
      rij.querySelector('[data-mv=url]').value=v.url;meld('Ontwerp geüpload; klik op opslaan');}catch(x){meld(x.message,true);}};i.click();return;}
  b.disabled=true;
  try{
    if(a==='opslaan'){const w={};document.querySelectorAll('#prodigi [data-pv]').forEach(i=>w[i.dataset.pv]=i.type==='checkbox'?i.checked:i.value);
      w.branding=[...document.querySelectorAll('#prodigi [data-merk]')].map(r=>({type:r.dataset.merk,url:r.querySelector('[data-mv=url]').value.trim(),verplicht:r.querySelector('[data-mv=verplicht]').checked})).filter(x=>x.url);
      if(w.aan&&!w.sandbox&&!confirm('Betaalde productie via Prodigi live zetten? Betaalde bestellingen worden dan echt gedrukt en verzonden (op jouw kosten bij Prodigi).')){b.disabled=false;return;}
      await papi('instellingen',{waarden:w});meld('Prodigi-instellingen opgeslagen');await laadProdigi();return;}
    if(a==='ping'){const r=await fetch('/api/prodigi?actie=ping',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({omgeving:document.querySelector('#prodigi [data-pv=sandbox]').checked?'sandbox':'live'})}).then(r=>r.json());
      uit.innerHTML=`<span class="${r.ok?'ok':'nok'}">${esc(r.info||r.melding)}</span>`;}
    if(a==='verwerk'){const r=await papi('verwerk',{});const v=r.verwerk;
      uit.innerHTML=v.uit?'Prodigi staat uit.':`verstuurd ${v.verstuurd} · geblokkeerd ${v.geblokkeerd} · fout ${v.fout} · opnieuw later ${v.opnieuw} · onzeker ${v.onzeker} · status bijgewerkt ${r.statussen.bijgewerkt}`;laadOverzicht();laadLijst();}
  }catch(x){if(x.message!=='uit'){uit.innerHTML=`<span class="nok">${esc(x.message)}</span>`;}}
  b.disabled=false;
});
async function laadKanalen(){
  laadProdigi();
  try{const {kanalen,cron}=await kapi('overzicht');
    $('#kanaalKaarten').innerHTML=['bol','etsy','amazon'].map(k=>{const c=kanalen[k],s=c.instellingen,l=c.listings,laatste=c.laatste[0];
      return `<div class="kanaal" data-k="${k}">
      <h3>${KNAAM[k]} <span class="${s.aan?'ok':''}">${s.aan?(s.proef?'aan · proefmodus':'aan · live'):'uit'}</span></h3>
      <p class="mini">${c.sleutels?'<span class="ok">sleutels aanwezig</span>':`<span class="nok">nog in Vercel zetten: ${esc(c.sleutelnamen)}</span>`}${k==='etsy'?` · ${c.koppeling?`<span class="ok">gekoppeld met ${esc(c.koppeling.shop_naam||c.koppeling.shop_id)}</span>`:'<span class="nok">nog niet gekoppeld</span>'}`:''}</p>
      <p class="mini" style="margin-bottom:8px">listings: ${l.aan} aangeboden · ${l.actief} actief · ${l.wacht} in behandeling · ${l.fout} met fout</p>
      <div class="rij"><label>kanaal aan</label><input type="checkbox" class="schakel" data-v="aan" ${s.aan?'checked':''}></div>
      <div class="rij"><label>proefmodus (niets naar ${KNAAM[k]} sturen)</label><input type="checkbox" class="schakel" data-v="proef" ${s.proef?'checked':''}></div>
      ${k==='etsy'?`<div class="rij"><label>automatisch publiceren (anders alleen via "publiceer" op Verkoopkanalen)</label><input type="checkbox" class="schakel" data-v="auto_publiceren" ${s.auto_publiceren?'checked':''}></div>`:''}
      ${VELDEN[k].map(([v,lab])=>`<div class="rij"><label>${lab}</label><input data-v="${v}" value="${esc(s[v]??'')}"></div>`).join('')}
      <div class="acties" style="margin-top:10px">
        <button class="vol" data-ka="opslaan">opslaan</button><button data-ka="ping">test verbinding</button><button data-ka="sync">nu synchroniseren</button>
        ${k==='etsy'?`<button data-ka="koppel">${c.koppeling?'opnieuw koppelen':'koppel Etsy'}</button>${c.koppeling?'<button data-ka="profielen">profielen ophalen</button>':''}`:''}
      </div>
      ${k==='etsy'?`<p class="mini" style="margin-top:6px">Callback-URL voor je Etsy-app: ${esc(c.terugUrl)}</p>`:''}
      <div class="mini" id="uit-${k}" style="margin-top:8px">${laatste?`laatste run ${datum(laatste.op)} (${esc(laatste.actie)}${laatste.proef?', proef':''}): ${logTekst(laatste.log)}`:'nog niet gesynchroniseerd'}</div>
      </div>`;}).join('')+(cron?'':`<div class="waarschuw" style="grid-column:1/-1">Automatisch synchroniseren staat nog uit: zet CRON_SECRET (min. 16 tekens) in Vercel én als GitHub-secret (zie README). Tot die tijd: "nu synchroniseren".</div>`);
  }catch(e){if(e.message!=='uit')meld(e.message,true);}
}
$('#kanaalKaarten').addEventListener('click',async e=>{
  const b=e.target.closest('[data-ka]');if(!b)return;const kaart=b.closest('.kanaal'),k=kaart.dataset.k,a=b.dataset.ka,uit=$('#uit-'+k);b.disabled=true;
  try{
    if(a==='opslaan'){const w={};kaart.querySelectorAll('[data-v]').forEach(i=>w[i.dataset.v]=i.type==='checkbox'?i.checked:i.value);
      if(w.aan&&!w.proef&&!confirm(`${KNAAM[k]} live zetten? Listings, prijzen en verzendingen gaan dan echt naar ${KNAAM[k]}.`)){b.disabled=false;return;}
      await kapi('instellingen',{method:'POST',body:{kanaal:k,waarden:w}});meld('Instellingen opgeslagen');laadKanalen();}
    if(a==='ping'){const r=await kapi('ping',{method:'POST',body:{kanaal:k}});uit.innerHTML=`<span class="${r.ok?'ok':'nok'}">verbinding ${r.ok?'in orde':'mislukt'}: ${esc(r.info||r.status)}</span>`;}
    if(a==='sync'){uit.textContent='bezig…';const r=await kapi('sync',{method:'POST',body:{kanaal:k}});
      uit.innerHTML=`${r.proef?'proefmodus · ':''}${logTekst(r.log)}${r.proef_schrijfacties?.length?`<div>zou versturen: ${r.proef_schrijfacties.slice(0,8).map(esc).join(', ')}${r.proef_schrijfacties.length>8?' …':''}</div>`:''}`;laadAssort();laadOverzicht();laadLijst();}
    if(a==='koppel'){const r=await kapi('etsy-koppel');location.href=r.url;}
    if(a==='profielen'){const r=await kapi('etsy-profielen');
      uit.innerHTML=['verzendprofielen','verwerkingsprofielen','retourbeleid'].map(x=>`<div><b>${x}:</b> ${(r[x]||[]).map(p=>`${esc(p.id)} (${esc(p.naam)})`).join(', ')||'geen'}</div>`).join('');}
  }catch(err){if(err.message!=='uit'){uit.innerHTML=`<span class="nok">${esc(err.message)}</span>`;meld(err.message,true);}}
  b.disabled=false;
});
async function laadAssort(){
  const k=$('#assortKanaal').value;
  $('#assortUitleg').textContent=k==='etsy'?'Etsy: één listing per poster, met de drie formaten als keuze.':`${KNAAM[k]} eist per formaat een eigen EAN-code (te koop bij GS1 Nederland).`;
  try{const {listings}=await kapi('listings',{params:{kanaal:k}});
    $('#assortLijst').innerHTML=`<table><thead><tr><th>aanbieden</th><th>poster</th><th>formaat</th>${k!=='etsy'?'<th>EAN</th>':''}<th class="r">prijs op ${KNAAM[k]}</th><th>status</th><th>melding</th></tr></thead><tbody>${listings.map(l=>`<tr>
      <td><input type="checkbox" class="schakel" data-lid="${l.id}" ${l.ingeschakeld?'checked':''}></td><td>${esc(l.poster_naam)}</td><td>${esc(l.formaat_label)}</td>
      ${k!=='etsy'?`<td><input type="text" inputmode="numeric" data-ean="${esc(l.poster_id)}|${esc(l.formaat)}" value="${esc(l.ean||'')}" placeholder="13 cijfers"></td>`:''}
      <td class="r">${Array.isArray(l.prijs)?l.prijs.map(euro).join(' / '):euro(l.prijs)}</td><td>${esc(l.status)}${l.extern_id?`<div class="mini">${esc(l.extern_id)}</div>`:''}</td><td class="mini ${l.laatste_fout?'nok':''}">${esc(l.laatste_fout||'')}</td></tr>`).join('')}</tbody></table>`;
  }catch(e){if(e.message!=='uit')$('#assortLijst').innerHTML=`<div class="leeg">${esc(e.message)}</div>`;}
}
$('#assortKanaal').addEventListener('change',laadAssort);
$('#assortLijst').addEventListener('change',async e=>{
  const t=e.target;
  try{
    if(t.dataset.lid){await kapi('listing',{method:'POST',body:{id:Number(t.dataset.lid),ingeschakeld:t.checked}});meld(t.checked?'Wordt bij de volgende sync aangeboden':'Wordt bij de volgende sync gepauzeerd');}
    if(t.dataset.ean!==undefined){const [poster_id,formaat]=t.dataset.ean.split('|');await kapi('ean',{method:'POST',body:{poster_id,formaat,ean:t.value}});meld('EAN opgeslagen');t.style.borderColor='';}
  }catch(err){if(err.message!=='uit'){meld(err.message,true);if(t.dataset.ean!==undefined)t.style.borderColor='var(--rood)';else t.checked=!t.checked;}}
});
for(const [id,aan] of [['#allesAan',true],['#allesUit',false]])$(id).addEventListener('click',async()=>{const k=$('#assortKanaal').value;
  if(!confirm(aan?`Alle posters op ${KNAAM[k]} aanbieden?`:`Alle posters op ${KNAAM[k]} pauzeren?`))return;
  try{await kapi('alles',{method:'POST',body:{kanaal:k,aan}});laadAssort();}catch(e){if(e.message!=='uit')meld(e.message,true);}});
{const m=new URLSearchParams(location.search).get('melding');if(m){setTimeout(()=>meld(m,/mislukt/.test(m)),600);history.replaceState(null,'',location.pathname+location.hash);}}
start().then(()=>{const h=location.hash.slice(1);if(h==='kanalen'||h==='producten'||h==='verkoop'||h.startsWith('product/'))toonView(h.startsWith('product/')?'producten':h);});
</script>
